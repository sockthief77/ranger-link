<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranger dash</title>
<!-- Forwarding page for the Ranger dash. The board posts its local address (the phone's hotspot changes it now and
     then) to an ntfy.sh topic each time it joins; this page reads the latest and opens the dash there.
     /            head-unit dash  (http://ADDRESS/?car)
     /?diag       the board's log (http://ADDRESS/diag)
     /?phone      phone dash      (http://ADDRESS/)
     Code: github.com/sockthief77/ranger-link. Board side: ranger-monitor src/main.cpp, announceTask. -->
<style>
  html, body { margin: 0; height: 100%; background: #020504; color: #f0dcb0; font-family: Consolas, "Roboto Mono", monospace; }
  main { height: 100%; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 16px; text-align: center; }
  h1 { margin: 0; font-weight: 400; letter-spacing: 0.28em; font-size: clamp(1.2rem, 5vw, 2rem); }
  #msg { font-size: clamp(1rem, 4vw, 1.4rem); color: #bcff00; }
  #sub { font-size: 0.95rem; max-width: 34em; line-height: 1.4; }
  a.btn { display: inline-block; padding: 12px 22px; border: 2px solid #bcff00; border-radius: 5px; color: #bcff00; text-decoration: none; font-size: 1.1rem; letter-spacing: 0.08em; }
  a.btn[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>FORD FUCKIN RANGER</h1>
  <div id="msg">Finding the truck…</div>
  <div id="sub"></div>
  <a class="btn" id="last" hidden></a>
</main>
<script>
const q = new URLSearchParams(location.search);
const TOPIC = q.get('t') || 'ranger-dash-e13811f951ccbf9f';   // ?t= only for testing
const PATH = q.has('diag') ? '/diag' : q.has('phone') ? '/' : '/?car';
const ADDR = /^\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?$/;
const $ = (id) => document.getElementById(id);

function saved() { try { return localStorage.getItem('ranger.addr') || ''; } catch { return ''; } }
function go(addr) {
  try { localStorage.setItem('ranger.addr', addr); } catch { /* private mode */ }
  location.replace(`http://${addr}${PATH}`);
}

const last = saved();
if (last) {
  $('last').hidden = false;
  $('last').href = `http://${last}${PATH}`;
  $('last').textContent = `Last address: ${last}`;
}

async function latest() {
  const res = await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=12h`, { cache: 'no-store' });
  if (!res.ok) throw new Error(res.status);
  let addr = '';
  for (const line of (await res.text()).split('\n')) {
    if (!line.trim()) continue;
    const m = JSON.parse(line);
    if (m.event === 'message' && ADDR.test((m.message || '').trim())) addr = m.message.trim();
  }
  return addr;
}

// The board posts a few seconds after joining the hotspot, so keep asking for a minute after the key goes on.
let tries = 0;
async function find() {
  tries++;
  try {
    const addr = await latest();
    if (addr) { $('msg').textContent = `Truck at ${addr}`; go(addr); return; }
    $('msg').textContent = 'Waiting for the truck…';
    $('sub').textContent = 'Key on, phone hotspot on. The dash opens by itself once the truck reports in.';
  } catch {
    // no mobile signal: the last known address is the best guess
    if (last) { $('msg').textContent = `No signal. Trying ${last}`; setTimeout(() => go(last), 1200); return; }
    $('msg').textContent = 'No signal to look the truck up.';
  }
  if (tries < 30) setTimeout(find, 3000);
  else $('sub').textContent = 'The truck hasn’t reported in. Is the key on and the hotspot on? Reload to try again.';
}
find();
</script>
</body>
</html>
